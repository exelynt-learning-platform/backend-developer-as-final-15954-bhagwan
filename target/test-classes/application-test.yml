spring:
  datasource:
    url: jdbc:h2:mem:booking_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
jwt:
  secret: test-secret-key-that-is-at-least-32-characters-long
  expiration-ms: 600000
